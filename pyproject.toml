[build-system]
# The SPDX license expression below needs setuptools 77 or newer.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logsentinel"
version = "1.0.1"
description = "Local Linux log observatory: an LLM reviews logs and resource metrics, the evidence is kept, and problems are reported and explained"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ianmove" }
]
keywords = ["logs", "log-analysis", "monitoring", "security", "llm", "ollama", "llama.cpp", "vllm", "lm-studio", "journald", "syslog", "systemd"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Monitoring",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.0.0,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.25.0,<1",
    "httpcore>=1.0,<2",
    "rich>=13.0.0,<16",
    "typer>=0.9.0,<1",
    "fastapi>=0.115.0,<1",
    "uvicorn>=0.30.0,<1",
    "regex>=2024.5.15",
    # Imported directly by the code; fastapi brings them, but the floor is ours.
    "starlette>=0.40,<2",
    "anyio>=4,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
logsentinel = "logsentinel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["logsentinel*"]
exclude = ["tests*", "systemd*", "logsentinel.portal.static.tutorials*"]

[tool.setuptools.package-data]
"logsentinel.portal" = ["static/*"]

[tool.setuptools.exclude-package-data]
"*" = ["static/tutorials", "static/tutorials/*", "static/tutorials/**/*"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["logsentinel/portal/static"]

[tool.ruff.lint]
# Real defects only: undefined or unused names, common bug patterns, blocking
# calls in async code. Style is deliberately left out.
select = ["E9", "F", "B", "ASYNC"]
ignore = [
    "B008",     # typer.Option(...) as a default is how typer is used
    "ASYNC109", # a timeout parameter on an async function is fine here
    "ASYNC240", # short pathlib calls in async code; the heavy work is threaded
]

[tool.ruff.lint.per-file-ignores]
# Fixtures imported from another test module look unused to the linter.
"tests/*" = ["F401", "F811"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
packages = ["logsentinel"]
