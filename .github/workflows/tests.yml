name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/evaluate_portal.py --output /tmp/evaluation.json
      - run: python -m pip wheel . --no-deps -w /tmp/wheels
      - run: python scripts/check_wheel.py /tmp/wheels/*.whl
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      # The versions the browser walkthroughs were validated with.
      - run: python -m pip install -c constraints-tested-py312.txt -e '.[dev]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/portal_smoke.py
      - run: python scripts/setup_smoke.py
      - run: python scripts/problem_smoke.py
      - run: python scripts/refresh_race_smoke.py
      - run: python scripts/metrics_smoke.py
      - run: python scripts/providers_smoke.py
      - run: python scripts/capacity_smoke.py
      - run: python scripts/review_state_smoke.py
      - run: python scripts/chat_smoke.py
      - run: python scripts/machines_resources_smoke.py
      - run: python scripts/guidance_smoke.py
      - run: python scripts/themes_smoke.py
      - run: node scripts/omarchy_smoke.mjs
