name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python scripts/evaluate_portal.py --output /tmp/evaluation.json
      - run: python -m pip wheel . --no-deps -w /tmp/wheels
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/portal_smoke.py
      - run: python scripts/setup_smoke.py
      - run: python scripts/problem_smoke.py
